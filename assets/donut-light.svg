      .t-ring-l{ font: 600 10px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #636c76; letter-spacing: 0.16em; }
      @keyframes pulse { 0% { r: 4; opacity: 0.35; } 70% { r: 9; opacity: 0; } 100% { r: 9; opacity: 0; } }
