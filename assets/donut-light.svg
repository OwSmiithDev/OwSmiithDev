<svg width="340" height="300" viewBox="0 0 340 300"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Linguagens por repositório">
  <style>
    .t-title   { font: 600 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #0969da; }
    .t-label   { font: 400 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #636c76; }
    .t-value   { font: 600 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #1f2328;
                 font-variant-numeric: tabular-nums; }
    .t-big     { font: 700 26px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #1f2328;
                 font-variant-numeric: tabular-nums; }
    .t-eyebrow { font: 600 9px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #636c76;
                 letter-spacing: 0.09em; }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade { animation: fade-up 0.5s ease-out backwards; }
    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; }
    }
  </style>

  <rect width="340" height="300" rx="10" fill="#ffffff" />
  <rect x="0.5" y="0.5" width="339" height="299" rx="10"
          fill="none" stroke="#d0d7de" />
  <text x="25" y="41" class="t-title">Linguagens por repositório</text>

  <g transform="translate(25, 59)">
    <style>
      .t-legend { font: 400 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #636c76; }
      .t-legend-val { font: 600 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #1f2328;
                      font-variant-numeric: tabular-nums; }
    </style>

    <circle cx="145" cy="78" r="68" fill="none"
            stroke="#eaeef2" stroke-width="20" />

    <g transform="rotate(-90 145 78)">
      <circle cx="145" cy="78" r="68"
        fill="none" stroke="#3178c6" stroke-width="20"
        stroke-dasharray="210.63 216.63"
        stroke-dashoffset="0.00"
        class="fade" style="animation-delay:0ms">
        <title>TypeScript — 50.0%</title>
      </circle>
      <circle cx="145" cy="78" r="68"
        fill="none" stroke="#e34c26" stroke-width="20"
        stroke-dasharray="139.42 287.84"
        stroke-dashoffset="-213.63"
        class="fade" style="animation-delay:90ms">
        <title>HTML — 33.3%</title>
      </circle>
      <circle cx="145" cy="78" r="68"
        fill="none" stroke="#3572A5" stroke-width="20"
        stroke-dasharray="68.21 359.05"
        stroke-dashoffset="-356.05"
        class="fade" style="animation-delay:180ms">
        <title>Python — 16.7%</title>
      </circle>
    </g>

    <text x="145" y="83" text-anchor="middle" class="t-big">8</text>
    <text x="145" y="103" text-anchor="middle" class="t-eyebrow">REPOSITÓRIOS</text>

    <g transform="translate(0.0, 186)" class="fade" style="animation-delay:180ms">
        <image x="0" y="-11" width="14" height="14" href="data:image/svg+xml;base64,"
          preserveAspectRatio="xMidYMid meet" />
        <text x="22" y="0" class="t-legend">TypeScript</text>
        <text x="127.0" y="0" class="t-legend-val" text-anchor="end">50,0%</text>
        <title>TypeScript — 50,0%</title>
      </g>
    <g transform="translate(145.0, 186)" class="fade" style="animation-delay:270ms">
        <image x="0" y="-11" width="14" height="14" href="data:image/svg+xml;base64,"
          preserveAspectRatio="xMidYMid meet" />
        <text x="22" y="0" class="t-legend">HTML</text>
        <text x="127.0" y="0" class="t-legend-val" text-anchor="end">33,3%</text>
        <title>HTML — 33,3%</title>
      </g>
    <g transform="translate(0.0, 208)" class="fade" style="animation-delay:360ms">
        <image x="0" y="-11" width="14" height="14" href="data:image/svg+xml;base64,"
          preserveAspectRatio="xMidYMid meet" />
        <text x="22" y="0" class="t-legend">Python</text>
        <text x="127.0" y="0" class="t-legend-val" text-anchor="end">16,7%</text>
        <title>Python — 16,7%</title>
      </g>
  </g>
</svg>